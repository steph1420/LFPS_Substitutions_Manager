<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Substitution Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="app-header">
        <div class="header-top">
            <div class="title-wrapper">
                <h1>Front Desk</h1>
                <span class="version-badge">v1.1</span>
            </div>
            <button id="edit-toggle-btn" class="btn-primary">Edit Schedule</button>
        </div>
        
        <div class="day-selector">
            <button class="day-btn active" data-day="MON">MON</button>
            <button class="day-btn" data-day="TUE">TUE</button>
            <button class="day-btn" data-day="WED">WED</button>
            <button class="day-btn" data-day="THU">THU</button>
            <button class="day-btn" data-day="FRI">FRI</button>
            <button class="day-btn" data-day="SAT">SAT</button>
        </div>
    </header>

    <main class="app-content">
        
        <!-- TAB 1: DASHBOARD (Grid Matrix Layout) -->
        <section id="tab-dashboard" class="tab-section active">
            <div class="absent-tray-container">
                <h3>Mark Absences</h3>
                <div class="absent-tray" id="teacher-roster"></div>
            </div>

            <div class="master-routine-container">
                <div class="routine-header">
                    <h2>Master Routine</h2>
                    <label class="toggle-switch">
                        <input type="checkbox" id="hide-absent-toggle">
                        <span class="slider round"></span>
                        <span class="label-text">Hide Absent</span>
                    </label>
                </div>
                
                <div class="table-scroll-container">
                    <table id="routine-table" class="routine-table">
                        <!-- JS will populate the spreadsheet here -->
                    </table>
                </div>
            </div>
        </section>

        <!-- TAB 2: RESOLVER -->
        <section id="tab-resolver" class="tab-section">
            <div class="resolver-header">
                <h2>Action Required</h2>
                <p>Assign substitutes for flagged periods.</p>
                <button id="auto-resolve-btn" class="btn-magic hidden">✨ Auto-Resolve</button>
            </div>
            <div class="conflict-list" id="conflict-list"></div>
        </section>

        <!-- TAB 3: CARDS (Old Layout) -->
        <section id="tab-cards" class="tab-section">
            <div class="routine-header" style="margin-bottom:15px;">
                <h2>Routine (Card View)</h2>
            </div>
            <div class="timeline-grid" id="timeline-grid"></div>
        </section>

    </main>

    <div id="undo-toast" class="toast hidden">
        <span id="toast-message">Action completed.</span>
        <button id="undo-btn">↩ Undo</button>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <button class="nav-btn active" data-target="tab-dashboard">
            <span class="icon">📊</span>
            <span>Grid</span>
        </button>
        <button class="nav-btn" data-target="tab-resolver">
            <span class="icon">⚠️</span>
            <span>Resolver</span>
            <span class="badge hidden" id="resolver-badge">0</span> 
        </button>
        <button class="nav-btn" data-target="tab-cards">
            <span class="icon">📅</span>
            <span>Cards</span>
        </button>
    </nav>

    <div id="bottom-sheet" class="bottom-sheet hidden">
        <div class="sheet-handle"></div>
        <h3>Select Substitute</h3>
        <div class="sheet-content" id="sheet-teacher-list"></div>
    </div>
    <div id="sheet-overlay" class="overlay hidden"></div>

    <script src="app.js"></script>
</body>
</html>
