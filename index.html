<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Optimizes the app for mobile screens and enables PWA behavior -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Substitution Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- App Header & Global Controls -->
    <header class="app-header">
        <div class="header-top">
            <h1>Front Desk</h1>
            <!-- The Live/Freeze replacement: Edit / Save Mode -->
            <button id="edit-toggle-btn" class="btn-primary">Edit Schedule</button>
        </div>
        
        <!-- iOS-Style Segmented Control for Days -->
        <div class="day-selector">
            <button class="day-btn active" data-day="MON">MON</button>
            <button class="day-btn" data-day="TUE">TUE</button>
            <button class="day-btn" data-day="WED">WED</button>
            <button class="day-btn" data-day="THU">THU</button>
            <button class="day-btn" data-day="FRI">FRI</button>
            <button class="day-btn" data-day="SAT">SAT</button>
        </div>
    </header>

    <!-- Main Application Canvas -->
    <main class="app-content">
        
        <!-- TAB 1: DASHBOARD (Master Routine & Absent Marker) -->
        <section id="tab-dashboard" class="tab-section active">
            
            <!-- Absent Tray: Horizontally scrolling profile circles -->
            <div class="absent-tray-container">
                <h3>Mark Absences</h3>
                <div class="absent-tray" id="teacher-roster">
                    <!-- JavaScript will populate the 9 teachers here -->
                </div>
            </div>

            <!-- Master Routine Timeline -->
            <div class="master-routine-container">
                <div class="routine-header">
                    <h2>Master Routine</h2>
                    <label class="toggle-switch">
                        <input type="checkbox" id="hide-absent-toggle">
                        <span class="slider round"></span>
                        <span class="label-text">Hide Absent</span>
                    </label>
                </div>
                
                <div class="timeline-grid" id="timeline-grid">
                    <!-- JavaScript will generate the periods and teacher cards here -->
                </div>
            </div>
        </section>

        <!-- TAB 2: THE RESOLVER (Possibilities & Cascading Swaps) -->
        <section id="tab-resolver" class="tab-section">
            <div class="resolver-header">
                <h2>Action Required</h2>
                <p>Assign substitutes for flagged periods.</p>
                <button id="auto-resolve-btn" class="btn-magic hidden">✨ Auto-Resolve</button>
            </div>
            
            <div class="conflict-list" id="conflict-list">
                <!-- JavaScript will populate pink cards needing assignments here -->
            </div>
        </section>

    </main>

    <!-- Floating Undo Toast Notification -->
    <div id="undo-toast" class="toast hidden">
        <span id="toast-message">Action completed.</span>
        <button id="undo-btn">↩ Undo</button>
    </div>

    <!-- Bottom Navigation Bar (Mobile Native Feel) -->
    <nav class="bottom-nav">
        <button class="nav-btn active" data-target="tab-dashboard">
            <span class="icon">📅</span>
            <span>Dashboard</span>
        </button>
        <button class="nav-btn" data-target="tab-resolver">
            <span class="icon">⚠️</span>
            <span>Resolver</span>
            <!-- Notification badge for empty slots -->
            <span class="badge hidden" id="resolver-badge">0</span> 
        </button>
    </nav>

    <!-- The Slide-Up Bottom Sheet for Teacher Selection -->
    <div id="bottom-sheet" class="bottom-sheet hidden">
        <div class="sheet-handle"></div>
        <h3>Select Substitute</h3>
        <div class="sheet-content" id="sheet-teacher-list">
            <!-- JS populates Available (Bright) and Busy (Dimmed) teachers here -->
        </div>
    </div>
    <div id="sheet-overlay" class="overlay hidden"></div>

    <!-- Core Logic Engine -->
    <script src="app.js"></script>
</body>
</html>
