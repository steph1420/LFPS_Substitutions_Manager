# Checks that gate the Render deploy (render.yaml: autoDeployTrigger: checksPass).
# Render only watches checks on commits that land on next-gen. bundle/* / preview/*
# runs are for early feedback and do not affect production deploys.
name: ci
on:
  push:
    branches:
      - next-gen
      - 'bundle/**'
      - 'preview/**'
  pull_request:
    branches: [next-gen]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      # The spreadsheet ID is config (render.yaml), never compiled in.
      - run: "! grep -rn --include='*.go' '1ST9ThXZQ7PaRpl' ."
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm test
